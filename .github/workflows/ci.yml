name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: |-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

on:
  push:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  pull_request:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  workflow_dispatch:

jobs:
  doc:
    uses: ComPWA/actions/.github/workflows/ci-docs.yml@588d066e5319c158d8ebc23b9699f19b7c68c641 # v4.2.2
    permissions:
      pages: write
      id-token: write
    with:
      apt-packages: graphviz
      python-version: "3.13"
  style:
    secrets:
      token: ${{ secrets.PAT }}
    uses: ComPWA/actions/.github/workflows/style.yml@588d066e5319c158d8ebc23b9699f19b7c68c641 # v4.2.2
    with:
      python-version: "3.13"
  test:
    uses: ComPWA/actions/.github/workflows/test.yml@588d066e5319c158d8ebc23b9699f19b7c68c641 # v4.2.2
    with:
      coverage-python-version: "3.13"
      macos-python-version: "3.11"
      macos-runner: macos-latest
      multithreaded: false
      test-output-path: tests/output/
      ubuntu-runner: ubuntu-26.04
